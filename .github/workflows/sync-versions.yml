name: sync-versions

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: sync-versions
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect version pills from latest GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess, urllib.request

          MAP = {
              "ElecPilot": "elecpilot/index.html",
              "OpenCode-Free-Radar": "opencode-free-radar/index.html",
              "Privnum": "Privnum/index.html",
          }
          BRANCH = "sync/version-pills"

          def latest(repo):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/Hcmdz/{repo}/releases/latest",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)["tag_name"]
              except Exception as e:
                  print(f"::warning::no usable release for {repo}: {e}")
                  return None

          changed = []
          for repo, path in MAP.items():
              tag = latest(repo)
              if not tag:
                  continue
              want = tag if tag.startswith("v") else f"v{tag}"
              p = open(path).read()
              new, n = re.subn(r"v[\d.]+ ·", want + " ·", p, count=1)
              if n != 1:
                  print(f"::warning::{path}: version pill pattern not found")
                  continue
              if new != p:
                  open(path, "w").write(new)
                  changed.append((repo, want))
              else:
                  print(f"{repo} already at {want}")

          if not changed:
              print("versions already in sync")
              raise SystemExit(0)

          body = "\n".join(f"- `{repo}` -> `{tag}`" for repo, tag in changed)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-B", BRANCH], check=True)
          for repo, path in MAP.items():
              subprocess.run(["git", "add", path], check=True)
          subprocess.run(["git", "commit", "-m", "chore(site): sync hero version pills from latest releases"], check=True)
          # Plain force: the branch is scratch space owned by this job alone, and
          # the intent is to reset it to main plus the new pills. A lease needs a
          # known remote state, which a fresh checkout does not have.
          subprocess.run(["git", "push", "--force", "origin", BRANCH], check=True)

          summary = (
              "Nightly sync of the hero version pills from the latest GitHub releases.\n\n"
              + body
              + "\n\nOpened by the nightly job. Merge once `validate` is green."
          )
          exists = subprocess.run(
              ["gh", "pr", "list", "--head", BRANCH, "--state", "open", "--json", "number", "--jq", "length"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          if exists == "0":
              subprocess.run(
                  ["gh", "pr", "create", "--head", BRANCH, "--title",
                   "chore(site): sync hero version pills from latest releases", "--body", summary],
                  check=True,
              )
              print("PR opened")
          else:
              subprocess.run(
                  ["gh", "pr", "edit", BRANCH, "--title",
                   "chore(site): sync hero version pills from latest releases", "--body", summary],
                  check=True,
              )
              print("PR updated")

          # Auto-merge once the required check passes, so the nightly job stays
          # hands-off without weakening branch protection.
          rc = subprocess.run(["gh", "pr", "merge", BRANCH, "--squash", "--auto"],
                              capture_output=True, text=True, check=False).returncode
          print(f"auto-merge rc={rc}")
          EOF